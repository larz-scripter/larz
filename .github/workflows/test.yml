name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # versions available on current ubuntu-latest runners; the code is pure
        # stdlib and also runs on 3.7–3.10 (and even 3.6), just not CI'd here.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite (no dependencies, no pytest)
        run: |
          python tests/test_core.py
          python tests/test_features.py
          python tests/test_v1.py
