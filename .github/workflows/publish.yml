name: publish to PyPI

# Publishes on a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
# using PyPI Trusted Publishing (OIDC) — no API token/secret needed once the
# project's trusted publisher is configured on PyPI. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
